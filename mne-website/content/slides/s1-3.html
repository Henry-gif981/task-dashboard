<header class="sh">
  <h3 class="eyebrow" data-morph="eyebrow">1.3. Business strategies of MNEs</h3>
  <h4 class="st" data-morph="title">1.3.1. Generic international strategies of MNEs</h4>
</header>
<div class="body split-r">
  <div class="stack">
    {{b:p-a}}
    <p class="irnote" data-web>Select a quadrant of Figure 1.3 to read the strategy from Table 1.4.</p>
  </div>
  <figure class="fig" id="f1-3">
    <div class="ir" style="height:610px" data-fig>
      <p class="ax-y">Pressure for cost reduction / global integration</p>
      <div class="grid" role="group" aria-label="Figure 1.3 quadrants">
        <span class="ticks ty hi">High</span><span class="ticks ty lo2">Low</span>
        <button type="button" class="q" data-q="global" data-morph="q-global" aria-pressed="false"><b>GLOBAL</b><small>(Standardization) Strategy</small><em>One product, scale economies, low-cost locations</em></button>
        <button type="button" class="q tn" data-q="trans" data-morph="q-trans" aria-pressed="false"><b>TRANSNATIONAL</b><small>Strategy</small><em><strong>Efficiency + local fit + worldwide learning</strong></em></button>
        <button type="button" class="q lo" data-q="int" data-morph="q-int" aria-pressed="false"><b>INTERNATIONAL</b><small>Strategy</small><em>Transfer home-country know-how abroad</em></button>
        <button type="button" class="q" data-q="multi" data-morph="q-multi" aria-pressed="false"><b>MULTI-DOMESTIC</b><small>(Localization) Strategy</small><em>Customize products market by market</em></button>
        <span class="ticks tx2 l">Low</span><span class="ticks tx2 h">High</span>
      </div>
      <p class="ax-x" style="margin-top:22px">Pressure for local responsiveness</p>
    </div>
    <figcaption class="fcap" style="font-size:22px"><span class="fno">Figure 1.3.</span> Strategic choices of MNEs: integration versus responsiveness</figcaption>
  </figure>
</div>
